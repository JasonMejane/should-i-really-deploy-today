<!doctype html>
<html lang="fr">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Should I Really Deploy Today? (Synthwave Troll Edition)</title>
		<!-- Importation d'une police futuriste et rétro-synthwave depuis Google Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&display=swap" rel="stylesheet" />

		<style>
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			body {
				font-family:
					"Orbitron",
					-apple-system,
					BlinkMacSystemFont,
					sans-serif;
				background-color: #0d0814;
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				min-height: 100vh;
				color: #ffffff;
				text-align: center;
				padding: 20px;
				position: relative;
				overflow-x: hidden;
				transition: background-color 0.5s ease;
			}

			/* Effet de grille rétro en arrière-plan */
			body::before {
				content: "";
				position: absolute;
				width: 200%;
				height: 200%;
				top: -50%;
				left: -50%;
				background-image:
					linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
					linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
				background-size: 40px 40px;
				transform: perspective(500px) rotateX(60deg);
				z-index: 1;
				animation: grid-move 20s linear infinite;
			}

			@keyframes grid-move {
				0% {
					transform: perspective(500px) rotateX(60deg) translateY(0);
				}
				100% {
					transform: perspective(500px) rotateX(60deg) translateY(40px);
				}
			}

			.container {
				max-width: 750px;
				z-index: 2;
				display: flex;
				flex-direction: column;
				align-items: center;
				margin: auto;
			}

			h3 {
				font-size: 1.3rem;
				font-weight: 500;
				text-transform: uppercase;
				letter-spacing: 4px;
				color: #8b9bb4;
				text-shadow: 0 0 5px rgba(139, 155, 180, 0.3);
				margin-bottom: 2.5rem;
			}

			.answer {
				font-size: 9rem;
				font-weight: 900;
				letter-spacing: 2px;
				margin-bottom: 2rem;
				text-transform: uppercase;
				transition: all 0.5s ease;
				user-select: none;
			}

			.reason {
				font-size: 1.4rem;
				font-weight: 500;
				min-height: 5.5rem;
				line-height: 1.6;
				letter-spacing: 1px;
				transition: all 0.5s ease;
				margin-bottom: 3rem;
				padding: 0 10px;
			}

			/* --- STYLE DU BOUTON REFRESH NÉON --- */
			.refresh-btn {
				font-family: "Orbitron", sans-serif;
				background: transparent;
				border-style: solid;
				border-width: 2px;
				padding: 12px 28px;
				font-size: 0.9rem;
				font-weight: 900;
				letter-spacing: 2px;
				text-transform: uppercase;
				cursor: pointer;
				border-radius: 4px;
				transition: all 0.3s ease;
				outline: none;
			}

			.refresh-btn:active {
				transform: scale(0.95);
			}

			/* --- SÉLECTEUR DE LANGUE NÉON --- */
			.lang-selector {
				position: absolute;
				top: 25px;
				right: 25px;
				z-index: 3;
				display: flex;
				gap: 10px;
			}

			.lang-btn {
				font-family: "Orbitron", sans-serif;
				background: rgba(0, 0, 0, 0.5);
				color: #566573;
				border: 1px solid rgba(255, 255, 255, 0.1);
				padding: 6px 12px;
				font-size: 0.8rem;
				cursor: pointer;
				border-radius: 4px;
				transition: all 0.3s ease;
			}

			/* --- CONFIGURATION DYNAMIQUE DES THÈMES NÉON --- */

			/* Mode VENDREDI : Néon Violet */
			body.deploy-yes {
				background-color: #120224;
			}
			body.deploy-yes .answer {
				color: #e0b0ff;
				text-shadow:
					0 0 10px #b57edc,
					0 0 30px #9b59b6,
					0 0 60px #8e44ad;
			}
			body.deploy-yes .reason {
				color: #d2b4de;
				text-shadow: 0 0 8px rgba(155, 89, 182, 0.5);
			}
			body.deploy-yes .refresh-btn {
				color: #e0b0ff;
				border-color: #b57edc;
				text-shadow: 0 0 5px #b57edc;
				box-shadow:
					inset 0 0 8px rgba(181, 126, 220, 0.2),
					0 0 8px rgba(181, 126, 220, 0.2);
			}
			body.deploy-yes .refresh-btn:hover {
				background: #b57edc;
				color: #120224;
				box-shadow:
					0 0 20px #9b59b6,
					0 0 40px #8e44ad;
				text-shadow: none;
			}
			body.deploy-yes .lang-btn.active {
				color: #e0b0ff;
				border-color: #b57edc;
				text-shadow: 0 0 5px #b57edc;
				box-shadow: 0 0 10px rgba(181, 126, 220, 0.3);
			}

			/* Mode AUTRES JOURS : Néon Orange */
			body.deploy-no {
				background-color: #1a0f05;
			}
			body.deploy-no .answer {
				color: #ffe3cc;
				text-shadow:
					0 0 10px #ffaa66,
					0 0 30px #ff7700,
					0 0 60px #d35400;
			}
			body.deploy-no .reason {
				color: #ffccaa;
				text-shadow: 0 0 8px rgba(211, 84, 0, 0.5);
			}
			body.deploy-no .refresh-btn {
				color: #ffe3cc;
				border-color: #ffaa66;
				text-shadow: 0 0 5px #ffaa66;
				box-shadow:
					inset 0 0 8px rgba(255, 170, 102, 0.2),
					0 0 8px rgba(255, 170, 102, 0.2);
			}
			body.deploy-no .refresh-btn:hover {
				background: #ffaa66;
				color: #1a0f05;
				box-shadow:
					0 0 20px #ff7700,
					0 0 40px #d35400;
				text-shadow: none;
			}
			body.deploy-no .lang-btn.active {
				color: #ffe3cc;
				border-color: #ffaa66;
				text-shadow: 0 0 5px #ffaa66;
				box-shadow: 0 0 10px rgba(255, 170, 102, 0.3);
			}

			/* Badge Fuseau Horaire */
			.timezone-badge {
				font-size: 0.8rem;
				font-weight: 500;
				letter-spacing: 2px;
				color: #566573;
				background: rgba(0, 0, 0, 0.4);
				border: 1px solid rgba(255, 255, 255, 0.05);
				padding: 8px 16px;
				border-radius: 4px;
			}

			.site-footer {
				width: 100%;
				max-width: 750px;
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 12px;
				z-index: 2;
			}

			.disclaimer {
				color: #8b9bb4;
				font-family: Arial, sans-serif;
				font-size: 0.75rem;
				line-height: 1.5;
			}
		</style>
	</head>
	<body>
		<div class="lang-selector">
			<button id="lang-fr" class="lang-btn" onclick="setLanguage('fr')">FR</button>
			<button id="lang-en" class="lang-btn" onclick="setLanguage('en')">EN</button>
		</div>

		<div class="container">
			<h3 id="question-text">Should I really deploy today?</h3>
			<div id="answer" class="answer">-</div>
			<div id="reason" class="reason">...</div>
			<button id="refresh-btn" class="refresh-btn">-</button>
		</div>

		<footer class="site-footer">
			<div id="timezone-badge" class="timezone-badge">ZONE // -</div>
			<p id="disclaimer" class="disclaimer"></p>
		</footer>

		<script>
			const i18n = {
				fr: {
					question: "Dois-je vraiment déployer aujourd'hui ?",
					btnRefresh: "Vraiment ? Re-vérifier la matrice",
					disclaimer:
						"Ce site est une œuvre humoristique : ne prenez pas ses conseils au pied de la lettre. Le créateur décline toute responsabilité si votre prod est maltraitée ou blessée.",
					friday: [
						"Vraiment ? C'est le meilleur moment pour tester la résilience de l'équipe d'astreinte.",
						"Absolument. Rien de tel qu'un bon crash en prod pour pimenter le week-end.",
						"Fonce ! Si ça casse, c'est le problème du toi du lundi.",
						"YOLO. De toute façon, l'équipe support n'avait rien de prévu ce samedi.",
						"Oui ! Le frisson du bouton 'Deploy' à 16h55 un vendredi est irremplaçable.",
						"Tu veux vraiment que ton week-end commence par un rollback d'urgence à 2h du matin ? Moi aussi ! :)",
						"Allez, c'est le moment de briller et de montrer ton courage légendaire !",
						"Je veux dire... qu'est-ce qui pourrait mal se passer ? C'est vendredi après-midi, tout le monde est déjà en week-end mentalement après tout.",
					],
					weekday: [
						"Trop risqué. Attends sagement le vendredi après-midi.",
						"Et rater l'occasion de tout casser juste avant le week-end ? Jamais.",
						"Un mardi ? Mais quel manque flagrant de courage et de panache.",
						"La charte du développeur interdit formellement de déployer en début de semaine.",
						"Non. Si la prod tombe aujourd'hui, tu vas devoir la réparer pendant tes heures de travail.",
						"Que dirais-tu de : NON ?!",
					],
					weekend: [
						"Déployer un jour de week-end ? Tu es déjà censé être en train de réparer le bug de vendredi !",
						"C'est le week-end. Laisse la prod mourir en paix.",
						"Même les serveurs se reposent. Ne les réveille pas pour rien.",
						"Si tu pushes ce code maintenant, tu vas passer ton dimanche sur Slack. Réfléchis bien.",
						"Impossible. L'équipe d'astreinte a coupé ses téléphones de toute façon.",
					],
				},
				en: {
					question: "Should I really deploy today?",
					btnRefresh: "Really? Re-check the Matrix",
					disclaimer:
						"This site is intended as humor; don't take its advice literally. The creator accepts no responsibility if your production environment is mistreated or injured.",
					friday: [
						"Absolutely! Friday afternoon is the optimal window to stress-test your team's mental health.",
						"Do it. Nothing says 'romantic weekend' like an emergency roll-back at 2 AM on a Saturday.",
						"Go ahead! If it blows up, that sounds like a problem for 'Monday You'.",
						"YOLO. It's not like the customer support team had any major plans for their weekend anyway.",
						"Yes! The adrenaline rush of hitting 'Deploy' at 4:55 PM on a Friday is a drug you cannot buy.",
						"You really want your weekend to start with an emergency rollback at 2 AM? Me too! :)",
						"Come on, it's time to shine and show off your legendary courage!",
						"I mean... what could possibly go wrong? It's Friday afternoon, everyone is already mentally on the weekend anyway.",
					],
					weekday: [
						"Way too risky. Be a professional and wait until Friday afternoon like everyone else.",
						"And miss out on the opportunity to ruin your team's upcoming weekend? Absolutely not.",
						"On a Tuesday? Where is your sense of danger? Where is your flair?",
						"The Developer Manifesto strictly forbids pushing code when you actually have time to fix it.",
						"No. If production crashes today, you'll have to repair it during actual office hours. Borrrring.",
						"How about: NO?!",
					],
					weekend: [
						"Deploying on a weekend? Aren't you supposed to be fixing the bug you deployed on Friday?",
						"It's the weekend. Let production rest in agonizing pain.",
						"Even the AWS servers are sleeping. Do not wake them up for your unoptimized codebase.",
						"If you push this now, you will spend your entire Sunday on Slack. Think about your life choices.",
						"Access denied. The on-call engineer has already put their phone in a glass of water.",
					],
				},
			};

			let currentLang = "en";
			let lastRandomIndex = -1;

			function detectBrowserLanguage() {
				const browserLang = navigator.language || navigator.userLanguage;
				if (browserLang && browserLang.startsWith("fr")) {
					currentLang = "fr";
				} else {
					currentLang = "en";
				}
			}

			function setLanguage(lang) {
				currentLang = lang;
				document.getElementById("lang-fr").classList.toggle("active", lang === "fr");
				document.getElementById("lang-en").classList.toggle("active", lang === "en");
				checkDeploymentPolicy();
			}

			function checkDeploymentPolicy() {
				const answerElement = document.getElementById("answer");
				const reasonElement = document.getElementById("reason");
				const badgeElement = document.getElementById("timezone-badge");
				const questionElement = document.getElementById("question-text");
				const refreshBtnElement = document.getElementById("refresh-btn");
				const disclaimerElement = document.getElementById("disclaimer");

				questionElement.innerText = i18n[currentLang].question;
				refreshBtnElement.innerText = i18n[currentLang].btnRefresh;
				disclaimerElement.innerText = i18n[currentLang].disclaimer;

				let userTimeZone = "UTC";
				try {
					userTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
				} catch (e) {
					console.warn("Unable to fetch timezone, falling back to UTC.");
				}

				badgeElement.innerText = `ZONE // ${userTimeZone.toUpperCase()}`;

				const now = new Date();
				const localDayString = now.toLocaleDateString("en-US", {
					weekday: "long",
					timeZone: userTimeZone,
				});

				let currentPool = [];
				if (localDayString === "Friday") {
					document.body.className = "deploy-yes";
					answerElement.innerText = currentLang === "fr" ? "OUI" : "YES";
					currentPool = i18n[currentLang].friday;
				} else {
					document.body.className = "deploy-no";
					answerElement.innerText = currentLang === "fr" ? "NON" : "NO";

					if (localDayString === "Saturday" || localDayString === "Sunday") {
						currentPool = i18n[currentLang].weekend;
					} else {
						currentPool = i18n[currentLang].weekday;
					}
				}

				let randomIndex;
				do {
					randomIndex = Math.floor(Math.random() * currentPool.length);
				} while (randomIndex === lastRandomIndex && currentPool.length > 1);

				lastRandomIndex = randomIndex;
				reasonElement.innerText = currentPool[randomIndex];
			}

			detectBrowserLanguage();
			document.getElementById(`lang-${currentLang}`).classList.add("active");
			document.getElementById("refresh-btn").addEventListener("click", checkDeploymentPolicy);
			checkDeploymentPolicy();
		</script>
	</body>
</html>
