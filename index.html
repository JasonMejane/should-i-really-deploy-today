			body::before {
				content: "";
				position: absolute;
				width: 200%;
				height: 200%;
				top: -50%;
				left: -50%;
				background-image:

				transform: perspective(500px) rotateX(60deg);
				z-index: 1;
				animation: grid-move 20s linear infinite;
			}

			@keyframes grid-move {
				0% {
					transform: perspective(500px) rotateX(60deg) translateY(0);
				}
				100% {
					transform: perspective(500px) rotateX(60deg) translateY(40px);
				}
			}

			.refresh-btn:active {

			let currentLang = "en";
			let lastRandomIndex = -1;

			function detectBrowserLanguage() {
				const browserLang = navigator.language || navigator.userLanguage;
				if (browserLang && browserLang.startsWith("fr")) {
					currentLang = "fr";
				} else if (browserLang && browserLang.startsWith("es")) {
					currentLang = "es";
				} else if (browserLang && browserLang.startsWith("pt")) {
					currentLang = "pt";
				} else if (browserLang && browserLang.startsWith("de")) {
					currentLang = "de";
				} else if (browserLang && browserLang.startsWith("ja")) {
					currentLang = "ja";
				} else if (browserLang && browserLang.startsWith("zh")) {
					currentLang = "zh";
				} else {
					currentLang = "en";
				}
			}

			function setLanguage(lang) {
				currentLang = lang;
				document.documentElement.lang = lang;
				document.getElementById("lang-fr").classList.toggle("active", lang === "fr");
				document.getElementById("lang-en").classList.toggle("active", lang === "en");
				document.getElementById("lang-es").classList.toggle("active", lang === "es");
				document.getElementById("lang-pt").classList.toggle("active", lang === "pt");
				document.getElementById("lang-de").classList.toggle("active", lang === "de");
				document.getElementById("lang-ja").classList.toggle("active", lang === "ja");
				document.getElementById("lang-zh").classList.toggle("active", lang === "zh");
				checkDeploymentPolicy();
			}

			function checkDeploymentPolicy() {
				const answerElement = document.getElementById("answer");
				const reasonElement = document.getElementById("reason");
				const badgeElement = document.getElementById("timezone-badge");
				const questionElement = document.getElementById("question-text");
				const refreshBtnElement = document.getElementById("refresh-btn");
				const disclaimerElement = document.getElementById("disclaimer");

				questionElement.innerText = i18n[currentLang].question;
				refreshBtnElement.innerText = i18n[currentLang].btnRefresh;
				disclaimerElement.innerText = i18n[currentLang].disclaimer;

				let userTimeZone = "UTC";
				try {
					userTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
				} catch (e) {
					console.warn("Unable to fetch timezone, falling back to UTC.");
				}

				badgeElement.innerText = `ZONE // ${userTimeZone.toUpperCase()}`;

				const now = new Date();
				const localDayString = now.toLocaleDateString("en-US", {
					weekday: "long",
					timeZone: userTimeZone,
				});

				let currentPool = [];
				if (localDayString === "Friday") {
					document.body.className = "deploy-yes";
					if (currentLang === "fr") {
						answerElement.innerText = "OUI";
					} else if (currentLang === "es") {
						answerElement.innerText = "SÍ";
					} else if (currentLang === "pt") {
						answerElement.innerText = "SIM";
					} else if (currentLang === "de") {
						answerElement.innerText = "JA";
					} else if (currentLang === "ja") {
						answerElement.innerText = "はい";
					} else if (currentLang === "zh") {
						answerElement.innerText = "是";
					} else {
						answerElement.innerText = "YES";
					}
					currentPool = i18n[currentLang].friday;
				} else {
					document.body.className = "deploy-no";
					if (currentLang === "fr") {
						answerElement.innerText = "NON";
					} else if (currentLang === "es") {
						answerElement.innerText = "NO";
					} else if (currentLang === "pt") {
						answerElement.innerText = "NÃO";
					} else if (currentLang === "de") {
						answerElement.innerText = "NEIN";
					} else if (currentLang === "ja") {
						answerElement.innerText = "いいえ";
					} else if (currentLang === "zh") {
						answerElement.innerText = "否";
					} else {
						answerElement.innerText = "NO";
					}

					if (localDayString === "Saturday" || localDayString === "Sunday") {
						currentPool = i18n[currentLang].weekend;
					} else {
						currentPool = i18n[currentLang].weekday;
					}
				}

				let randomIndex;
				do {
					randomIndex = Math.floor(Math.random() * currentPool.length);
				} while (randomIndex === lastRandomIndex && currentPool.length > 1);

				lastRandomIndex = randomIndex;
				reasonElement.innerText = currentPool[randomIndex];
			}

			detectBrowserLanguage();
			document.getElementById(`lang-${currentLang}`).classList.add("active");
			document.getElementById("refresh-btn").addEventListener("click", checkDeploymentPolicy);
			checkDeploymentPolicy();
		</script>
	</body>
