<!doctype html>
<html lang="fr">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Should I Really Deploy Today? (Synthwave Troll Edition)</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&display=swap" rel="stylesheet" />

		<style>
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			body {
				font-family:
					"Orbitron",
					-apple-system,
					BlinkMacSystemFont,
					sans-serif;
				background-color: #0d0814;
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				min-height: 100vh;
				color: #ffffff;
				text-align: center;
				padding: 20px;
				position: relative;
				overflow-x: hidden;
				transition: background-color 0.5s ease;
			}

			/* Background retro grid */
			body::before {
				content: "";
				position: absolute;
				width: 200%;
				height: 200%;
				top: -50%;
				left: -50%;
				background-image:
					linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
					linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
				background-size: 40px 40px;
				transform: perspective(500px) rotateX(60deg);
				z-index: 1;
				animation: grid-move 20s linear infinite;
			}

			@keyframes grid-move {
				0% {
					transform: perspective(500px) rotateX(60deg) translateY(0);
				}
				100% {
					transform: perspective(500px) rotateX(60deg) translateY(40px);
				}
			}

			.container {
				max-width: 750px;
				z-index: 2;
				display: flex;
				flex-direction: column;
				align-items: center;
				margin: auto;
			}

			h3 {
				font-size: 1.3rem;
				font-weight: 500;
				text-transform: uppercase;
				letter-spacing: 4px;
				color: #8b9bb4;
				text-shadow: 0 0 5px rgba(139, 155, 180, 0.3);
				margin-bottom: 2.5rem;
			}

			.answer {
				font-size: 9rem;
				font-weight: 900;
				letter-spacing: 2px;
				margin-bottom: 2rem;
				text-transform: uppercase;
				transition: all 0.5s ease;
				user-select: none;
			}

			.reason {
				font-size: 1.4rem;
				font-weight: 500;
				min-height: 5.5rem;
				line-height: 1.6;
				letter-spacing: 1px;
				transition: all 0.5s ease;
				margin-bottom: 3rem;
				padding: 0 10px;
			}

			/* --- Refresh button --- */
			.refresh-btn {
				font-family: "Orbitron", sans-serif;
				background: transparent;
				border-style: solid;
				border-width: 2px;
				padding: 12px 28px;
				font-size: 0.9rem;
				font-weight: 900;
				letter-spacing: 2px;
				text-transform: uppercase;
				cursor: pointer;
				border-radius: 4px;
				transition: all 0.3s ease;
				outline: none;
			}

			.refresh-btn:active {
				transform: scale(0.95);
			}

			/* --- Language selector --- */
			.lang-selector {
				position: absolute;
				top: 25px;
				right: 25px;
				z-index: 3;
				display: flex;
				gap: 10px;
			}

			.lang-btn {
				font-family: "Orbitron", sans-serif;
				background: rgba(0, 0, 0, 0.5);
				color: #566573;
				border: 1px solid rgba(255, 255, 255, 0.1);
				padding: 6px 12px;
				font-size: 0.8rem;
				cursor: pointer;
				border-radius: 4px;
				transition: all 0.3s ease;
			}

			/* --- Dynamic Theme Configuration --- */

			/* Friday mode (purple) */
			body.deploy-yes {
				background-color: #120224;
			}
			body.deploy-yes .answer {
				color: #e0b0ff;
				text-shadow:
					0 0 10px #b57edc,
					0 0 30px #9b59b6,
					0 0 60px #8e44ad;
			}
			body.deploy-yes .reason {
				color: #d2b4de;
				text-shadow: 0 0 8px rgba(155, 89, 182, 0.5);
			}
			body.deploy-yes .refresh-btn {
				color: #e0b0ff;
				border-color: #b57edc;
				text-shadow: 0 0 5px #b57edc;
				box-shadow:
					inset 0 0 8px rgba(181, 126, 220, 0.2),
					0 0 8px rgba(181, 126, 220, 0.2);
			}
			body.deploy-yes .refresh-btn:hover {
				background: #b57edc;
				color: #120224;
				box-shadow:
					0 0 20px #9b59b6,
					0 0 40px #8e44ad;
				text-shadow: none;
			}
			body.deploy-yes .lang-btn.active {
				color: #e0b0ff;
				border-color: #b57edc;
				text-shadow: 0 0 5px #b57edc;
				box-shadow: 0 0 10px rgba(181, 126, 220, 0.3);
			}

			/* Other days mode (orange) */
			body.deploy-no {
				background-color: #1a0f05;
			}
			body.deploy-no .answer {
				color: #ffe3cc;
				text-shadow:
					0 0 10px #ffaa66,
					0 0 30px #ff7700,
					0 0 60px #d35400;
			}
			body.deploy-no .reason {
				color: #ffccaa;
				text-shadow: 0 0 8px rgba(211, 84, 0, 0.5);
			}
			body.deploy-no .refresh-btn {
				color: #ffe3cc;
				border-color: #ffaa66;
				text-shadow: 0 0 5px #ffaa66;
				box-shadow:
					inset 0 0 8px rgba(255, 170, 102, 0.2),
					0 0 8px rgba(255, 170, 102, 0.2);
			}
			body.deploy-no .refresh-btn:hover {
				background: #ffaa66;
				color: #1a0f05;
				box-shadow:
					0 0 20px #ff7700,
					0 0 40px #d35400;
				text-shadow: none;
			}
			body.deploy-no .lang-btn.active {
				color: #ffe3cc;
				border-color: #ffaa66;
				text-shadow: 0 0 5px #ffaa66;
				box-shadow: 0 0 10px rgba(255, 170, 102, 0.3);
			}

			/* Timezone badge */
			.timezone-badge {
				font-size: 0.8rem;
				font-weight: 500;
				letter-spacing: 2px;
				color: #566573;
				background: rgba(0, 0, 0, 0.4);
				border: 1px solid rgba(255, 255, 255, 0.05);
				padding: 8px 16px;
				border-radius: 4px;
			}

			.site-footer {
				width: 100%;
				max-width: 750px;
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 12px;
				z-index: 2;
			}

			.disclaimer {
				color: #8b9bb4;
				font-family: Arial, sans-serif;
				font-size: 0.75rem;
				line-height: 1.5;
			}
		</style>
	</head>
	<body>
		<div class="lang-selector">
			<button id="lang-fr" class="lang-btn" onclick="setLanguage('fr')">FR</button>
			<button id="lang-en" class="lang-btn" onclick="setLanguage('en')">EN</button>
			<button id="lang-es" class="lang-btn" onclick="setLanguage('es')">ES</button>
			<button id="lang-pt" class="lang-btn" onclick="setLanguage('pt')">PT</button>
			<button id="lang-de" class="lang-btn" onclick="setLanguage('de')">DE</button>
		</div>

		<div class="container">
			<h3 id="question-text">Should I really deploy today?</h3>

			let currentLang = "en";
			let lastRandomIndex = -1;

			function detectBrowserLanguage() {
				const browserLang = navigator.language || navigator.userLanguage;
				if (browserLang && browserLang.startsWith("fr")) {
					currentLang = "fr";
				} else if (browserLang && browserLang.startsWith("es")) {
					currentLang = "es";
				} else if (browserLang && browserLang.startsWith("pt")) {
					currentLang = "pt";
				} else if (browserLang && browserLang.startsWith("de")) {
					currentLang = "de";
				} else {
					currentLang = "en";
				}
			}

			function setLanguage(lang) {
				currentLang = lang;
				document.documentElement.lang = lang;
				document.getElementById("lang-fr").classList.toggle("active", lang === "fr");
				document.getElementById("lang-en").classList.toggle("active", lang === "en");
				document.getElementById("lang-es").classList.toggle("active", lang === "es");
				document.getElementById("lang-pt").classList.toggle("active", lang === "pt");
				document.getElementById("lang-de").classList.toggle("active", lang === "de");
				checkDeploymentPolicy();
			}

			function checkDeploymentPolicy() {
				const answerElement = document.getElementById("answer");
				const reasonElement = document.getElementById("reason");
				const badgeElement = document.getElementById("timezone-badge");
				const questionElement = document.getElementById("question-text");
				const refreshBtnElement = document.getElementById("refresh-btn");
				const disclaimerElement = document.getElementById("disclaimer");

				questionElement.innerText = i18n[currentLang].question;
				refreshBtnElement.innerText = i18n[currentLang].btnRefresh;
				disclaimerElement.innerText = i18n[currentLang].disclaimer;

				let userTimeZone = "UTC";
				try {
					userTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
				} catch (e) {
					console.warn("Unable to fetch timezone, falling back to UTC.");
				}

				badgeElement.innerText = `ZONE // ${userTimeZone.toUpperCase()}`;

				const now = new Date();
				const localDayString = now.toLocaleDateString("en-US", {
					weekday: "long",
					timeZone: userTimeZone,
				});

				let currentPool = [];
				if (localDayString === "Friday") {
					document.body.className = "deploy-yes";
					if (currentLang === "fr") {
						answerElement.innerText = "OUI";
					} else if (currentLang === "es") {
						answerElement.innerText = "SÍ";
					} else if (currentLang === "pt") {
						answerElement.innerText = "SIM";
					} else if (currentLang === "de") {
						answerElement.innerText = "JA";
					} else {
						answerElement.innerText = "YES";
					}
					currentPool = i18n[currentLang].friday;
				} else {
					document.body.className = "deploy-no";
					if (currentLang === "fr") {
						answerElement.innerText = "NON";
					} else if (currentLang === "es") {
						answerElement.innerText = "NO";
					} else if (currentLang === "pt") {
						answerElement.innerText = "NÃO";
					} else if (currentLang === "de") {
						answerElement.innerText = "NEIN";
					} else {
						answerElement.innerText = "NO";
					}

					if (localDayString === "Saturday" || localDayString === "Sunday") {
						currentPool = i18n[currentLang].weekend;
					} else {
						currentPool = i18n[currentLang].weekday;
					}
				}

				let randomIndex;
				do {
					randomIndex = Math.floor(Math.random() * currentPool.length);
				} while (randomIndex === lastRandomIndex && currentPool.length > 1);

				lastRandomIndex = randomIndex;
				reasonElement.innerText = currentPool[randomIndex];
			}

			detectBrowserLanguage();
			document.getElementById(`lang-${currentLang}`).classList.add("active");
			document.getElementById("refresh-btn").addEventListener("click", checkDeploymentPolicy);
			checkDeploymentPolicy();
		</script>
	</body>
</html>
